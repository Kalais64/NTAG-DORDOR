<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOOD GIRL — Live Barista POS &amp; Kitchen Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Oxanium:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pos.css" />
</head>
<body>
  <div class="pos-bg" aria-hidden="true">
    <div class="pos-orb pos-orb-1"></div>
    <div class="pos-orb pos-orb-2"></div>
    <div class="pos-orb pos-orb-3"></div>
  </div>

  <div class="pos-app">
    <!-- Top Liquid-Glass Header -->
    <header class="pos-header">
      <div class="pos-brand-group">
        <div class="pos-brand-badge" aria-label="GOOD GIRL Logo">
          <svg viewBox="0 0 56 56" class="gg-svg" aria-hidden="true">
            <text x="28" y="25" text-anchor="middle" class="gg-text">GOOD</text>
            <text x="28" y="42" text-anchor="middle" class="gg-text">GIRL</text>
          </svg>
        </div>
        <div>
          <div class="pos-kicker-row">
            <span class="live-dot"></span>
            <span class="pos-kicker">LIVE POS KITCHEN DISPLAY • REAL-TIME SYNC</span>
          </div>
          <h1 class="pos-title">BARISTA &amp; ORDER DISPATCH</h1>
        </div>
      </div>

      <div class="pos-kpis" aria-label="Live metrics">
        <div class="kpi-pill">
          <span class="kpi-label">ACTIVE</span>
          <strong class="kpi-val" id="kpiActive">0</strong>
        </div>
        <div class="kpi-pill">
          <span class="kpi-label">READY</span>
          <strong class="kpi-val kpi-cyan" id="kpiReady">0</strong>
        </div>
        <div class="kpi-pill">
          <span class="kpi-label">SERVED</span>
          <strong class="kpi-val" id="kpiServed">0</strong>
        </div>
        <div class="kpi-pill kpi-rev">
          <span class="kpi-label">REVENUE</span>
          <strong class="kpi-val kpi-lime" id="kpiRevenue">Rp0</strong>
        </div>
      </div>

      <div class="pos-actions">
        <button type="button" class="pos-btn pos-btn-glass" id="posThemeToggle" aria-label="Switch POS theme">
          <span id="posThemeIcon" aria-hidden="true">&#9728;</span>
          <span id="posThemeLabel">Fresh White</span>
        </button>
        <button type="button" class="pos-btn pos-btn-glass" id="simOrderBtn">+ Simulate Web Order</button>
        <a href="index.html" target="_blank" rel="noopener" class="pos-btn pos-btn-lime">Customer Mobile App &nearr;</a>
      </div>
    </header>

    <!-- 4-Stage Live Kanban Board -->
    <main class="pos-board" aria-label="Order queue columns">
      <section class="pos-lane" data-lane="received">
        <header class="lane-head">
          <div class="lane-title-wrap">
            <span class="lane-dot dot-received"></span>
            <h2>1. ORDER RECEIVED</h2>
          </div>
          <span class="lane-count" id="count-received">0</span>
        </header>
        <div class="lane-list" id="lane-received"></div>
      </section>

      <section class="pos-lane" data-lane="preparing">
        <header class="lane-head">
          <div class="lane-title-wrap">
            <span class="lane-dot dot-preparing"></span>
            <h2>2. PREPARING</h2>
          </div>
          <span class="lane-count" id="count-preparing">0</span>
        </header>
        <div class="lane-list" id="lane-preparing"></div>
      </section>

      <section class="pos-lane" data-lane="ready">
        <header class="lane-head">
          <div class="lane-title-wrap">
            <span class="lane-dot dot-ready"></span>
            <h2>3. READY TO SERVE</h2>
          </div>
          <span class="lane-count" id="count-ready">0</span>
        </header>
        <div class="lane-list" id="lane-ready"></div>
      </section>

      <section class="pos-lane" data-lane="complete">
        <header class="lane-head">
          <div class="lane-title-wrap">
            <span class="lane-dot dot-complete"></span>
            <h2>4. COMPLETED</h2>
          </div>
          <span class="lane-count" id="count-complete">0</span>
        </header>
        <div class="lane-list" id="lane-complete"></div>
      </section>
    </main>
  </div>

  <!-- POS Payload JSON Inspector Modal -->
  <div class="pos-modal-backdrop" id="jsonModalBackdrop" aria-hidden="true">
    <div class="pos-modal" role="dialog" aria-modal="true" aria-labelledby="jsonModalTitle">
      <div class="pos-modal-head">
        <div>
          <p class="pos-kicker">WEBHOOK / POS PAYLOAD</p>
          <h3 id="jsonModalTitle">Order Payload</h3>
        </div>
        <div class="pos-modal-actions">
          <button type="button" class="pos-btn pos-btn-glass" id="copyJsonBtn">Copy JSON</button>
          <button type="button" class="pos-close-btn" id="closeJsonModal" aria-label="Close">&times;</button>
        </div>
      </div>
      <pre class="pos-json-pre" id="jsonModalContent"></pre>
    </div>
  </div>

  <div class="pos-toast" id="posToast" role="status" aria-live="polite"></div>

  <script src="menu-data.js"></script>
  <script src="pos-bridge.js"></script>
  <script src="pos.js" defer></script>
</body>
</html>
